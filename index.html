<html lang="ko"><head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.min.js" integrity="sha512-iZ2ORl595Wx6miw+GuadDet4WQbdSWS3JLMoNfY8cRGoEFy6oT3G9IbcrBeL6AfkgpA51ETt/faX6yLV+/gFJg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      (function() {
        const originalConsole = window.console;
        window.console = {
          log: (...args) => {
            originalConsole.log(...args);
            window.parent.postMessage({ type: 'console', message: args.join(' ') }, '*');
          },
          error: (...args) => {
            originalConsole.error(...args);
            window.parent.postMessage({ type: 'console', message: 'Error: ' + args.join(' ') }, '*');
          },
          warn: (...args) => {
            originalConsole.warn(...args);
            window.parent.postMessage({ type: 'console', message: 'Warning: ' + args.join(' ') }, '*');
          }
        };

        let requestId = 0;
        let callbacksMap = new Map();
        let streamControllers = new Map();
        
        window.claude = {
          complete: (prompt) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'claudeComplete', id, prompt }, '*');
            });
          }
        };

        window.storage = {
          get: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageGet', id, key, shared }, '*');
            });
          },
          set: (key, value, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageSet', id, key, value, shared }, '*');
            });
          },
          delete: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageDelete', id, key, shared }, '*');
            });
          },
          list: (prefix, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageList', id, prefix, shared }, '*');
            });
          }
        };

        let pendingBlobs = new Map();
        URL.createObjectURL = (blob) => {
          // Store the blob and create an ID and URL for it
          const blobId = `blob-${Date.now()}-${Math.random()}`;
          pendingBlobs.set(blobId, blob);
          return `blob-request://${blobId}`;
        };

        URL.revokeObjectURL = (url) => {
          // Remove the blob from our store
          const blobId = url.replace("blob-request://", "");
          pendingBlobs.delete(blobId);
        };

        const getBlobFromURL = (url) => {
          const blobId = url.replace("blob-request://", "");
          return pendingBlobs.get(blobId);
        };

        // Override global fetch with streaming support
        window.fetch = (url, init = {}) => {
          return new Promise((resolve, reject) => {
            const id = requestId++;
            const channelId = `fetch-${id}-${Date.now()}`;
            
            callbacksMap.set(id, { 
              resolve: (response) => {
                // Create a ReadableStream for the response body
                const stream = new ReadableStream({
                  start(controller) {
                    streamControllers.set(channelId, controller);
                  },
                  cancel() {
                    streamControllers.delete(channelId);
                  }
                });
                
                // Create and return the Response with the stream
                resolve(new Response(stream, {
                  status: response.status,
                  statusText: response.statusText,
                  headers: response.headers
                }));
              },
              reject,
              channelId
            });
            
            window.parent.postMessage({
              type: 'proxyFetch',
              id,
              url,
              init,
              channelId
            }, '*');
          });
        };

        window.addEventListener('message', async (event) => {
          if (event.data.type === 'takeScreenshot') {
            const rootElement = document.getElementById('artifacts-component-root-html');
            if (!rootElement) {
              window.parent.postMessage({
                type: 'screenshotError',
                error: new Error('Root element not found'),
              }, '*');
              return;
            }
            // Catch CDN load failures (htmlToImage undefined) and toPng errors
            // so the parent always gets a response instead of hanging forever.
            try {
              const screenshot = await htmlToImage.toPng(rootElement, {
                imagePlaceholder:
                  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAA1JREFUGFdjePDgwX8ACOQDoNsk0PMAAAAASUVORK5CYII=",
              });
              window.parent.postMessage({
                type: 'screenshotData',
                data: screenshot,
              }, '*');
            } catch (err) {
              window.parent.postMessage({
                type: 'screenshotError',
                error: err instanceof Error ? err : new Error(String(err)),
              }, '*');
            }
          } else if (event.data.type === 'claudeComplete') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.completion);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'proxyFetchResponse') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
              callbacksMap.delete(event.data.id);
            } else {
              // Initial response with headers, status, etc.
              callback.resolve({
                status: event.data.status,
                statusText: event.data.statusText,
                headers: event.data.headers
              });
              // Don't delete the callback yet if streaming
              if (!event.data.body) {
                callbacksMap.delete(event.data.id);
              }
            }
          } else if (event.data.type === 'proxyFetchStream') {
            // Handle streaming data chunks
            const controller = streamControllers.get(event.data.channelId);
            if (controller) {
              if (event.data.error) {
                controller.error(new Error(event.data.error));
                streamControllers.delete(event.data.channelId);
              } else if (event.data.done) {
                controller.close();
                streamControllers.delete(event.data.channelId);
                // Clean up the callback
                const callback = Array.from(callbacksMap.entries()).find(
                  ([_, value]) => value.channelId === event.data.channelId
                );
                if (callback) {
                  callbacksMap.delete(callback[0]);
                }
              } else if (event.data.chunk) {
                controller.enqueue(new Uint8Array(event.data.chunk));
              }
            }
          } else if (event.data.type === 'storageGet') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageSet') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageDelete') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageList') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          }
        });

        window.addEventListener('click', (event) => {
          const isEl = event.target instanceof HTMLElement;
          if (!isEl) return;
    
          // find ancestor links
          const linkEl = event.target.closest("a");
          if (!linkEl || !linkEl.href) return;
    
          event.preventDefault();
          event.stopImmediatePropagation();
    
          if (linkEl.href.startsWith("blob-request:")) {
            const blob = getBlobFromURL(linkEl.href);
            if (!blob) return;
            void blob.arrayBuffer().then((data) => {
              window.parent.postMessage({
                type: "downloadFile",
                filename: linkEl.download,
                data,
                mimeType: blob.type || "application/octet-stream",
              });
            });
          } else if (linkEl.href.startsWith("data:")) {
            const [header, base64Data] = linkEl.href.split(",");
            const mimeMatch = header.match(/data:([^;]+)/);
            const mimeType = mimeMatch ? mimeMatch[1] : "application/octet-stream";
            const binaryString = atob(base64Data);
            const data = Uint8Array.from(binaryString, (c) =>
              c.charCodeAt(0),
            ).buffer;
            window.parent.postMessage({
              type: "downloadFile",
              filename: linkEl.download,
              data,
              mimeType,
            });
          } else {
            let linkUrl;
            try {
              linkUrl = new URL(linkEl.href);
            } catch (error) {
              return;
            }
    
            if (linkUrl.hostname === window.location.hostname) return;
      
            window.parent.postMessage({
              type: 'openExternal',
              href: linkEl.href,
            }, '*');
          }
      });

        const originalOpen = window.open;
        window.open = function (url) {
          window.parent.postMessage({
            type: "openExternal",
            href: url,
          }, "*");
        };

        window.addEventListener('error', (event) => {
          window.parent.postMessage({ type: 'console', message: 'Uncaught Error: ' + event.message }, '*');
        });
      })();
    </script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>영단어 스펠링 게임</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh;}
#app{max-width:600px;margin:0 auto;padding:16px;}
button{font-family:inherit;border:none;outline:none;cursor:pointer;}
input{font-family:inherit;outline:none;}

/* colors */
:root{
  --bg:#f5f5f7;--card:#ffffff;--border:#d2d2d7;--border2:#e5e5ea;
  --text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;
  --green:#34c759;--green-bg:#e9f9ed;--green-text:#1a7a38;
  --red:#ff3b30;--red-bg:#fff0ef;--red-text:#a82019;
  --blue:#007aff;--blue-bg:#e8f2ff;--blue-text:#003d99;
  --yellow:#ff9f0a;--yellow-bg:#fff8e6;
  --navy:#0f1f4a;
}

.card{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:16px;}
.btn{padding:10px 18px;border-radius:12px;font-size:14px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--text);transition:opacity 0.1s;}
.btn:active{opacity:0.7;}
.btn-primary{background:var(--navy);color:white;border-color:var(--navy);}
.btn-green{background:var(--green-bg);color:var(--green-text);border-color:#a3d9b1;}
.btn-red{background:var(--red-bg);color:var(--red-text);border-color:#f4a9a4;}
.btn-blue{background:var(--blue-bg);color:var(--blue-text);border-color:#a3c4f5;}

/* progress bar */
.progress-wrap{position:relative;width:100%;height:140px;margin-bottom:14px;}
.progress-track{position:absolute;bottom:0;left:0;right:0;height:28px;background:var(--border2);border-radius:14px;overflow:hidden;}
.progress-fill{height:100%;border-radius:14px;transition:width 0.9s cubic-bezier(.4,0,.2,1);}
.bear-wrap{position:absolute;bottom:24px;transition:left 0.9s cubic-bezier(.2,0,.8,1);}
.flag{position:absolute;bottom:24px;right:0;font-size:18px;}

/* select grid */
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.day-card{background:var(--card);border:1.5px solid var(--border2);border-radius:14px;padding:14px;cursor:pointer;text-align:left;position:relative;transition:border-color 0.15s;}
.day-card.cleared{border-color:var(--red);}
.clear-badge{position:absolute;top:-10px;right:-10px;width:38px;height:38px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 2px 6px rgba(255,59,48,0.35);}
.clear-badge span{font-size:7px;font-weight:700;color:white;line-height:1.2;}

/* hint row */
.hint-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.hint-btn{font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);}
.hint-btn:disabled{opacity:0.35;}
.hint-btn.red{color:var(--red);border-color:#f4a9a4;}

/* answer row */
.answer-row{display:flex;gap:8px;}
.answer-input{flex:1;font-size:16px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:#f5f5f7;color:var(--text);letter-spacing:0.04em;}
.answer-input:focus{border-color:var(--blue);}

/* feedback */
.feedback{padding:10px 14px;border-radius:12px;text-align:center;font-size:14px;font-weight:500;margin-top:10px;}
.feedback.correct{background:var(--green-bg);color:var(--green-text);}
.feedback.wrong{background:var(--red-bg);color:var(--red-text);}

/* stats grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--border2);border-radius:12px;padding:12px;text-align:center;}

/* goal bar */
.goal-bar-wrap{height:8px;background:var(--border2);border-radius:4px;overflow:hidden;margin-top:6px;}
.goal-bar-fill{height:100%;border-radius:4px;transition:width 0.5s;}

/* speed timer */
.timer-wrap{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.timer-track{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden;}
.timer-fill{height:100%;border-radius:3px;transition:width 1s linear;}

/* combo badge */
.combo-badge{font-size:12px;font-weight:600;color:var(--red);background:var(--red-bg);padding:2px 8px;border-radius:6px;}

/* animations */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.8px)}}
@keyframes legL{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}
@keyframes legR{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}
@keyframes armL{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes armR{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes idleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.4px)}}
.run-body{animation:bob 0.35s ease-in-out infinite}
.run-tilt{transform-origin:18px 18px;animation:tilt 0.35s ease-in-out infinite}
.run-legL{transform-origin:15px 30px;animation:legL 0.35s ease-in-out infinite}
.run-legR{transform-origin:21px 30px;animation:legR 0.35s ease-in-out infinite}
.run-armL{transform-origin:11px 20px;animation:armL 0.35s ease-in-out infinite}
.run-armR{transform-origin:25px 20px;animation:armR 0.35s ease-in-out infinite}
.idle-body{animation:idleBob 1.2s ease-in-out infinite}

/* modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:380px;}

/* review badge */
.review-badge{font-size:11px;color:#854F0B;background:#FAEEDA;padding:2px 8px;border-radius:6px;}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.topbar-right{display:flex;gap:6px;align-items:center;}
.level-badge{background:var(--blue-bg);color:var(--blue-text);font-size:12px;font-weight:500;padding:3px 10px;border-radius:8px;}
.music-btn{font-size:12px;padding:3px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);}
.music-btn.on{background:var(--green-bg);color:var(--green-text);border-color:#a3d9b1;}

.hint-box{border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px;}
.hint-box.green{background:#f0faf3;border-left:3px solid var(--green);}
.hint-box.yellow{background:var(--yellow-bg);border-left:3px solid var(--yellow);}
.hint-box.red{background:var(--red-bg);border-left:3px solid var(--red);}

.word-count-badge{font-size:12px;color:var(--text2);background:#f5f5f7;padding:2px 10px;border-radius:8px;border:1px solid var(--border2);}

.section-title{font-size:11px;color:var(--text2);margin-bottom:4px;}
.score-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.score-num{font-size:26px;font-weight:500;}
</style>
</head>

// ── State ──
let state = {
  stage:'select', day:null, queue:[], idx:0, score:0, level:1,
  h1:false, h2:false, h3:false, answered:false, feedback:null, levelUp:false,
  ansVal:'', reviewList:[], reviewIdx:0, revVal:'', revAnswered:false, revFeedback:null,
  running:false, combo:0, maxCombo:0, correct:0, wrong:0,
  speedMode:false, timeLeft:15,
  clearedDays: JSON.parse(localStorage.getItem('clearedDays')||'{}'),
  currentGoal: JSON.parse(localStorage.getItem('currentGoal')||'null'),
  goalAchieved:false, showGoalModal:false, musicOn:false,
  goalType:'days', goalValue:3,
  comboPopup:null, stats:null
};

let timerInterval=null, audioCtx=null, musicNodes=[], musicLoop=null;

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setState(patch){Object.assign(state,patch);render();}

// ── Audio ──
function getCtx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function stopMusic(){clearTimeout(musicLoop);musicNodes.forEach(n=>{try{n.stop(0);}catch(e){}});musicNodes=[];}
function playMusicLoop(){
  stopMusic();
  const ctx=getCtx(),BPM=140,beat=60/BPM,now=ctx.currentTime,steps=32;
  const mk=(f,t,d,type,vol,filter)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.value=f;if(filter){const flt=ctx.createBiquadFilter();flt.type=filter.t;flt.frequency.value=filter.f;o.connect(flt);flt.connect(g);}else o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.01);musicNodes.push(o);};
  const noise=(t,d,vol,ft,ff)=>{const buf=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),dt=buf.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*Math.pow(1-i/dt.length,1.5);const s=ctx.createBufferSource();s.buffer=buf;const g=ctx.createGain(),flt=ctx.createBiquadFilter();flt.type=ft;flt.frequency.value=ff;s.connect(flt);flt.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(vol,t);s.start(t);s.stop(t+d+0.01);musicNodes.push(s);};
  for(let i=0;i<steps;i++){const t=now+i*beat;if(i%4===0||i%4===2){mk(140,t,.25,'sine',1.4,null);const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(38,t+.18);o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.22);o.start(t);o.stop(t+.23);musicNodes.push(o);}if(i%4===1||i%4===3)noise(t,.14,.9,'bandpass',2200);noise(t,.04,i%2===0?.28:.14,'highpass',9000);}
  [55,55,73,55,49,55,65,73].forEach((f,i)=>mk(f,now+i*beat,beat*.75,'sawtooth',.38,{t:'lowpass',f:320}));
  [[220,277,330],[196,247,294]].forEach(ch=>{for(let i=0;i<steps;i++)if(i%4===1||i%4===3)ch.forEach(f=>mk(f,now+i*beat,.12,'square',.06,{t:'lowpass',f:1800}));});
  [440,494,523,587,523,494,440,392,440,494,523,494,392,349,392,440].forEach((f,i)=>mk(f,now+i*(beat/2),beat*.45,'square',.07,{t:'lowpass',f:2400}));
  musicLoop=setTimeout(()=>{if(state.musicOn)playMusicLoop();},steps*beat*1000-60);
}
function playSfx(type){
  try{
    const ctx=getCtx(),master=ctx.createGain();master.gain.value=.4;master.connect(ctx.destination);
    if(type==='levelup'||type==='clear'){
      const notes=type==='clear'?[523,659,784,880,1047,1174]:[523,659,784,1047];
      notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(master);const t=ctx.currentTime+i*.1;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26);});
    }else if(type==='correct'){
      [[880,0],[1100,.1]].forEach(([f,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(master);const t=ctx.currentTime+d;g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.19);});
    }else if(type==='combo'){
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=1320;o.connect(g);g.connect(master);g.gain.setValueAtTime(.4,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);o.start(ctx.currentTime);o.stop(ctx.currentTime+.13);
    }else if(type==='wrong'){
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=180;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.start(ctx.currentTime);o.stop(ctx.currentTime+.31);
    }
  }catch(e){}
}

// ── Actions ──
function startDay(day,speed=false){
  clearInterval(timerInterval);
  setState({stage:'game',day,queue:shuffle(DAYS[day]),idx:0,score:0,level:1,
    h1:false,h2:false,h3:false,answered:false,feedback:null,ansVal:'',
    reviewList:[],reviewIdx:0,revVal:'',revAnswered:false,revFeedback:null,
    running:false,combo:0,maxCombo:0,correct:0,wrong:0,
    speedMode:speed,timeLeft:15,stats:null,goalAchieved:false});
  setTimeout(()=>document.getElementById('ans')?.focus(),100);
}

function triggerRun(){setState({running:true});setTimeout(()=>setState({running:false}),800);}

function addToReview(w){if(!state.reviewList.find(r=>r.word===w.word))setState({reviewList:[...state.reviewList,w]});}

function useHint(n){
  if(state.answered)return;
  if(n===1&&!state.h1)setState({h1:true});
  else if(n===2&&!state.h2)setState({h2:true});
  else if(n===3&&!state.h3){addToReview(state.queue[state.idx]);setState({h3:true});}
}

function checkAnswer(){
  if(state.answered||!state.ansVal.trim())return;
  clearInterval(timerInterval);
  const w=state.queue[state.idx];
  const ans=state.ansVal.trim().toLowerCase(),correct=w.word.toLowerCase();
  let pts=0;
  if(!state.h3)pts=state.h2?50:state.h1?80:100;
  if(ans===correct){
    const newCombo=state.combo+1;
    const bonus=newCombo>=3?Math.floor(pts*.1*(newCombo-2)):0;
    const total=pts+bonus;
    const ns=state.score+total,nl=Math.floor(ns/500)+1,isUp=nl>state.level;
    const newMax=Math.max(state.maxCombo,newCombo);
    if(isUp)playSfx('levelup');
    else if(newCombo>=3)playSfx('combo');
    else playSfx('correct');
    triggerRun();
    const msg=state.h3?'정답! (힌트3 사용 — 점수 없음)':`정답! +${pts}점${bonus>0?` 🔥콤보 +${bonus}점`:''}${newCombo>=2?` ${newCombo}콤보!`:''}`;
    const comboPopup=newCombo>=3?newCombo:null;
    setState({answered:true,score:ns,level:nl,combo:newCombo,maxCombo:newMax,correct:state.correct+1,
      levelUp:isUp,feedback:{type:'correct',msg},comboPopup});
    if(isUp)setTimeout(()=>setState({levelUp:false}),2200);
    if(comboPopup)setTimeout(()=>setState({comboPopup:null}),900);
  }else{
    playSfx('wrong');addToReview(state.queue[state.idx]);
    setState({answered:true,combo:0,wrong:state.wrong+1,feedback:{type:'wrong',msg:`오답! 정답: ${w.word} — 복습 추가됨`}});
  }
}

function nextWord(){
  const total=state.correct+state.wrong;
  const accuracy=total>0?Math.round((state.correct/total)*100):0;
  if(state.idx+1>=state.queue.length){
    const stats={score:state.score,correct:state.correct,wrong:state.wrong,maxCombo:state.maxCombo,accuracy};
    const newCleared={...state.clearedDays,[state.day]:{score:state.score,accuracy,date:new Date().toLocaleDateString()}};
    localStorage.setItem('clearedDays',JSON.stringify(newCleared));
    playSfx('clear');
    let goalAchieved=false,updatedGoal=state.currentGoal;
    if(state.currentGoal){
      const prog=state.currentGoal.type==='days'?Object.keys(newCleared).length:Math.max(state.currentGoal.progress||0,state.score);
      updatedGoal={...state.currentGoal,progress:prog};
      localStorage.setItem('currentGoal',JSON.stringify(updatedGoal));
      if((state.currentGoal.type==='days'&&prog>=state.currentGoal.value)||(state.currentGoal.type==='score'&&state.score>=state.currentGoal.value))goalAchieved=true;
    }
    if(state.reviewList.length>0){
      setState({stats,clearedDays:newCleared,currentGoal:updatedGoal,goalAchieved,reviewIdx:0,revVal:'',revAnswered:false,revFeedback:null,stage:'review'});
    }else{
      setState({stats,clearedDays:newCleared,currentGoal:updatedGoal,goalAchieved,stage:'result'});
    }
    return;
  }
  clearInterval(timerInterval);
  setState({idx:state.idx+1,h1:false,h2:false,h3:false,answered:false,feedback:null,ansVal:'',
    timeLeft:15});
  if(state.speedMode)startSpeedTimer();
  setTimeout(()=>document.getElementById('ans')?.focus(),80);
}

function startSpeedTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(state.timeLeft<=1){
      clearInterval(timerInterval);
      addToReview(state.queue[state.idx]);
      setState({answered:true,combo:0,wrong:state.wrong+1,timeLeft:0,feedback:{type:'wrong',msg:`시간 초과! 정답: ${state.queue[state.idx]?.word}`}});
      playSfx('wrong');
    }else setState({timeLeft:state.timeLeft-1});
  },1000);
}

function checkReview(){
  if(state.revAnswered||!state.revVal.trim())return;
  const rw=state.reviewList[state.reviewIdx];
  if(state.revVal.trim().toLowerCase()===rw.word.toLowerCase()){
    playSfx('correct');setState({revAnswered:true,score:state.score+50,revFeedback:{type:'correct',msg:'정답! +50점 (복습 보너스)'}});
  }else{
    playSfx('wrong');setState({revAnswered:true,revFeedback:{type:'wrong',msg:`오답! 정답: ${rw.word}`}});
  }
}
function nextReview(){
  if(state.reviewIdx+1>=state.reviewList.length){setState({stage:'result'});return;}
  setState({reviewIdx:state.reviewIdx+1,revVal:'',revAnswered:false,revFeedback:null});
  setTimeout(()=>document.getElementById('rev-ans')?.focus(),80);
}

function saveGoal(){
  const goal={type:state.goalType,value:Number(state.goalValue),
    progress:state.goalType==='days'?Object.keys(state.clearedDays).length:0};
  localStorage.setItem('currentGoal',JSON.stringify(goal));
  setState({currentGoal:goal,goalAchieved:false,showGoalModal:false});
}

// ── Render ──
function render(){
  const s=state;
  const app=document.getElementById('app');
  if(!app)return;

  const inLevel=s.score%500, pct=(inLevel/500)*100;
  const charX=Math.max(0,pct-9)+'%';
  const fillColor=s.combo>=5?'linear-gradient(90deg,#ff3b30,#ff9f0a)':'linear-gradient(90deg,#34c759,#30d158)';

  function scoreBar(){
    return `<div style="margin-bottom:14px">
      <div class="score-row">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="score-num">${s.score}점</div>
          ${s.combo>=2?`<span class="combo-badge">🔥 ${s.combo}콤보!</span>`:''}
        </div>
        <div style="font-size:12px;color:var(--text2)">${inLevel} / 500</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${fillColor}"></div></div>
        <div class="bear-wrap" style="left:${charX}">${bearSVG(s.running)}</div>
        ${s.comboPopup?`<div style="position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:22px;font-weight:600;color:var(--red);pointer-events:none">🔥 ${s.comboPopup}콤보!</div>`:''}
        <span class="flag">🏁</span>
      </div>
    </div>`;
  }

  function topBar(label){
    return `<div class="topbar">
      <button class="btn" onclick="setState({stage:'select'})" style="font-size:12px;padding:6px 12px">← Day 선택</button>
      <div style="font-size:13px;font-weight:500;color:var(--text2)">${label||s.day}${s.speedMode?'<span style="margin-left:6px;font-size:10px;background:var(--red-bg);color:var(--red-text);padding:1px 6px;border-radius:4px">⚡ 스피드</span>':''}</div>
      <div class="topbar-right">
        <span class="level-badge">Lv.${s.level}</span>
        <button class="music-btn ${s.musicOn?'on':''}" onclick="toggleMusic()">${s.musicOn?'♪ ON':'♪ OFF'}</button>
      </div>
    </div>`;
  }

  // Goal modal
  if(s.showGoalModal){
    app.innerHTML=`<div style="padding:16px">
      <div style="font-size:18px;font-weight:500;margin-bottom:16px">🎯 목표 설정</div>
      <div class="card" style="margin-bottom:12px">
        <div class="section-title">목표 유형</div>
        <div style="display:flex;gap:8px;margin-bottom:14px;margin-top:6px">
          <button class="btn ${s.goalType==='days'?'btn-blue':''}" style="flex:1" onclick="setState({goalType:'days'})">Day 클리어 수</button>
          <button class="btn ${s.goalType==='score'?'btn-blue':''}" style="flex:1" onclick="setState({goalType:'score'})">점수 달성</button>
        </div>
        <div class="section-title">${s.goalType==='days'?'클리어할 Day 수':'목표 점수'}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
          ${(s.goalType==='days'?[1,3,5,10]:[500,1000,2000,5000]).map(v=>`<button class="btn ${s.goalValue==v?'btn-blue':''}" onclick="setState({goalValue:${v}})">${v}${s.goalType==='score'?'점':''}</button>`).join('')}
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" onclick="setState({showGoalModal:false})">취소</button>
        <button class="btn btn-primary" style="flex:2" onclick="saveGoal()">설정 완료</button>
      </div>
    </div>`;
    return;
  }

  // Select
  if(s.stage==='select'){
    const goal=s.currentGoal;
    const goalProg=goal?Math.min(100,((goal.progress||0)/goal.value)*100):0;
    app.innerHTML=`<div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
        <div>
          <div style="font-size:20px;font-weight:600">영단어 스펠링 게임</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">숙명여고 2학년 1학기</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="music-btn ${s.musicOn?'on':''}" onclick="toggleMusic()" style="font-size:13px;padding:6px 12px">${s.musicOn?'♪ ON':'♪ OFF'}</button>
          <button class="btn" style="font-size:12px;padding:6px 12px" onclick="setState({showGoalModal:true})">🎯 목표</button>
          <button class="btn btn-blue" style="font-size:12px;padding:6px 12px" onclick="downloadHTML()">⬇️ 저장</button>
        </div>
      </div>
      ${goal?`<div class="card" style="margin-bottom:14px;background:${s.goalAchieved?'var(--green-bg)':'var(--card)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:13px;font-weight:500;color:${s.goalAchieved?'var(--green-text)':'var(--text)'}">${s.goalAchieved?'🎉 목표 달성!':'🎯 현재 목표'}</span>
          <span style="font-size:12px;color:var(--text2)">${goal.type==='days'?`${goal.progress||0} / ${goal.value} Day`:`${goal.progress||0} / ${goal.value}점`}</span>
        </div>
        <div class="goal-bar-wrap"><div class="goal-bar-fill" style="width:${goalProg}%;background:${s.goalAchieved?'var(--green)':'var(--blue)'}"></div></div>
      </div>`:''}
      <div class="day-grid">
        ${Object.keys(DAYS).map(day=>{
          const cl=s.clearedDays[day];
          return `<button class="day-card ${cl?'cleared':''}" onclick="startDay('${day}')">
            ${cl?`<div class="clear-badge"><span>CLEAR</span><span style="font-size:6px">${cl.accuracy}%</span></div>`:''}
            <div style="font-size:15px;font-weight:600;margin-bottom:2px">${day}</div>
            <div style="font-size:11px;color:var(--text2);margin-bottom:${cl?'4px':'10px'}">${DAYS[day].length}개 단어</div>
            ${cl?`<div style="font-size:10px;color:var(--red);font-weight:500">최고 ${cl.score}점</div>`:`<div style="font-size:12px;color:#1a7a38;font-weight:500">시작 →</div>`}
          </button>`;
        }).join('')}
      </div>
      <div class="card" style="margin-top:14px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:13px;font-weight:500">⚡ 스피드 모드</div>
          <div style="font-size:11px;color:var(--text2)">15초 안에 답하기!</div>
        </div>
        <select onchange="if(this.value){startDay(this.value,true);this.value='';}" style="font-size:12px;padding:6px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text)">
          <option value="" disabled selected>Day 선택</option>
          ${Object.keys(DAYS).map(d=>`<option value="${d}">${d}</option>`).join('')}
        </select>
      </div>
    </div>`;
    return;
  }

  // Result
  if(s.stage==='result'){
    const st=s.stats||{score:s.score,correct:s.correct,wrong:s.wrong,maxCombo:s.maxCombo,accuracy:Math.round((s.correct/(s.correct+s.wrong+.001))*100)};
    app.innerHTML=`<div style="padding:8px 0">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:40px;margin-bottom:8px">🎉</div>
        <div style="font-size:20px;font-weight:600;margin-bottom:4px">${s.day} 클리어!</div>
        <div style="font-size:32px;font-weight:600;color:#1a7a38">${st.score}점</div>
        ${s.goalAchieved?`<div style="margin-top:8px;font-size:14px;font-weight:500;color:var(--green-text);background:var(--green-bg);padding:6px 14px;border-radius:10px;display:inline-block">🎯 목표 달성!</div>`:''}
      </div>
      <div class="stats-grid">
        ${[['정답 수',st.correct+'개','#1a7a38'],['오답 수',st.wrong+'개','#a82019'],['정확도',st.accuracy+'%','#003d99'],['최고 콤보',st.maxCombo+'연속','#a82019']].map(([l,v,c])=>`
          <div class="stat-card"><div style="font-size:11px;color:var(--text2);margin-bottom:4px">${l}</div><div style="font-size:22px;font-weight:600;color:${c}">${v}</div></div>
        `).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn" onclick="startDay('${s.day}')">다시 풀기</button>
        <button class="btn btn-red" onclick="startDay('${s.day}',true)">⚡ 스피드 모드</button>
        <button class="btn" onclick="setState({stage:'select'})">Day 선택으로</button>
      </div>
    </div>`;
    return;
  }

  // Review
  if(s.stage==='review'){
    const rw=s.reviewList[s.reviewIdx];
    app.innerHTML=`<div>
      ${topBar(s.day+' — 복습')}
      ${scoreBar()}
      <div style="font-size:12px;color:#854F0B;text-align:right;margin-bottom:6px">복습 ${s.reviewIdx+1} / ${s.reviewList.length}</div>
      <div class="card" style="border:1.5px solid var(--yellow);margin-bottom:10px">
        <div style="font-size:11px;color:#854F0B;margin-bottom:6px">오답/힌트3 사용 단어 — 다시 도전!</div>
        <div style="font-size:22px;font-weight:500;margin-bottom:14px">${rw.meaning}</div>
        <div class="answer-row">
          <input id="rev-ans" class="answer-input" type="text" value="${s.revVal}" placeholder="영어 스펠링 입력..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en" ${s.revAnswered?'disabled':''} oninput="state.revVal=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();${s.revAnswered?'nextReview()':'checkReview()'}}">
          ${s.revAnswered
            ?`<button class="btn btn-green" onclick="nextReview()">${s.reviewIdx+1>=s.reviewList.length?'결과 보기':'다음 →'}</button>`
            :`<button class="btn btn-primary" onclick="checkReview()">확인</button>`}
        </div>
      </div>
      ${s.revFeedback?`<div class="feedback ${s.revFeedback.type}">${s.revFeedback.msg}</div>`:''}
    </div>`;
    setTimeout(()=>document.getElementById('rev-ans')?.focus(),80);
    return;
  }

  // Game
  const w=s.queue[s.idx];
  if(!w)return;
  const wordLen=w.word.split(' ').length;
  const lenLabel=wordLen>1?`${wordLen}단어 / 총 ${w.word.replace(/ /g,'').length}글자`:`${w.word.length}글자`;

  app.innerHTML=`<div>
    ${topBar()}
    ${scoreBar()}
    ${s.levelUp?`<div style="background:var(--green-bg);color:var(--green-text);border:1px solid #a3d9b1;border-radius:12px;padding:10px;text-align:center;font-size:15px;font-weight:500;margin-bottom:10px">🎉 레벨업! Level ${s.level} 달성!</div>`:''}
    ${s.speedMode?`<div class="timer-wrap">
      <div class="timer-track"><div class="timer-fill" style="width:${(s.timeLeft/15)*100}%;background:${s.timeLeft<=5?'var(--red)':'var(--blue)'}"></div></div>
      <span style="font-size:13px;font-weight:500;color:${s.timeLeft<=5?'var(--red)':'var(--text2)'};min-width:28px">${s.timeLeft}초</span>
    </div>`:''}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:12px;color:var(--text2)">${s.idx+1} / ${s.queue.length}</span>
      <div style="display:flex;gap:6px">
        ${s.reviewList.length>0?`<span class="review-badge">복습 예정 ${s.reviewList.length}개</span>`:''}
      </div>
    </div>
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:11px;color:var(--text2)">이 단어의 영어 스펠링은?</span>
        <span class="word-count-badge">${lenLabel}</span>
      </div>
      <div style="font-size:22px;font-weight:500;margin-bottom:14px">${w.meaning}</div>
      ${s.h1?`<div class="hint-box green">첫 글자: <strong>${w.word[0].toUpperCase()}</strong>${'_ '.repeat(w.word.replace(/ /g,'').length-1).trim()}</div>`:''}
      ${s.h2?`<div class="hint-box yellow">${w.hint2}</div>`:''}
      ${s.h3?`<div class="hint-box red">정답: <strong style="font-size:16px;letter-spacing:.05em">${w.word}</strong> <span style="font-size:11px;color:var(--red-text)">복습 추가됨</span></div>`:''}
      ${!s.answered?`<div class="hint-row">
        <button class="hint-btn" ${s.h1?'disabled':''} onclick="useHint(1)">💡 앞글자 (-20점) [1]</button>
        <button class="hint-btn" ${s.h2?'disabled':''} onclick="useHint(2)">💡 어원 (-50점) [2]</button>
        <button class="hint-btn red" ${s.h3?'disabled':''} onclick="useHint(3)">👁 정답보기 (0점) [3]</button>
      </div>`:''}
      <div class="answer-row">
        <input id="ans" class="answer-input" type="text" value="${s.ansVal.replace(/"/g,'&quot;')}" placeholder="영어 스펠링 입력..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en"
          oninput="state.ansVal=this.value"
          onkeydown="const k=event.key;if(k==='Enter'){event.preventDefault();${s.answered?'nextWord()':'checkAnswer()'};return;}if(!state.answered){if(k==='1'){event.preventDefault();useHint(1);}if(k==='2'){event.preventDefault();useHint(2);}if(k==='3'){event.preventDefault();useHint(3);}}">
        ${s.answered
          ?`<button class="btn btn-green" onclick="nextWord()">${s.idx+1>=s.queue.length?(s.reviewList.length>0?'복습 시작 →':'결과 보기'):'다음 →'}</button>`
          :`<button class="btn btn-primary" onclick="checkAnswer()">확인</button>`}
      </div>
    </div>
    ${s.feedback?`<div class="feedback ${s.feedback.type}">${s.feedback.msg}</div>`:''}
  </div>`;

  const ansEl=document.getElementById('ans');
  if(ansEl&&!s.answered){setTimeout(()=>ansEl.focus(),50);}
  if(s.speedMode&&!s.answered&&!timerInterval){startSpeedTimer();}
}

function toggleMusic(){
  if(state.musicOn){stopMusic();setState({musicOn:false});}
  else{playMusicLoop();setState({musicOn:true});}
}

function downloadHTML(){
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '영단어_스펠링_게임.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Init
render();
</script>


</body></html>
